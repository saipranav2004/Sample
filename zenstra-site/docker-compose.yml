# zenstra.ai: static site (nginx) and the demo request API (Node).
#
#   cp .env.example .env    # then set the values
#   docker compose up -d --build
#   docker compose --profile dev up -d --build   # adds Mailpit to catch email locally
#
# Production with HTTPS and log rotation: ./deploy.sh (see DEPLOY.md).
name: zenstra-site

services:
  web:
    build:
      context: ..
      dockerfile: zenstra-site/web/Dockerfile
      args:
        SITE_URL: ${DOMAIN:+https://${DOMAIN}}
      secrets: [build_ca]
    ports:
      - "8080:8080"
    environment:
      API_UPSTREAM: api:3000
    depends_on:
      api:
        condition: service_healthy
    networks: [public, internal]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  # Validates the demo form and emails it to sales. No database.
  api:
    build:
      context: ./api
      secrets: [build_ca]
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
    # internal: reached by web only; egress: out to the SMTP server.
    networks: [internal, egress]
    read_only: true
    tmpfs: [/tmp]
    init: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  # Development only: catches outgoing email. UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [dev]
    ports:
      - "8025:8025"
    networks: [internal, egress]
    restart: unless-stopped

networks:
  public: {}
  egress: {}
  internal:
    internal: true

# Extra CA certificate for builds behind a TLS-inspecting proxy. Empty by default.
secrets:
  build_ca:
    file: ${BUILD_CA_FILE:-/dev/null}
