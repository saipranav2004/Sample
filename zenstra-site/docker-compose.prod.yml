# Production additions: HTTPS, nightly database backups and log rotation.
#
#   ./deploy.sh            # checks .env, builds, starts, then smoke-tests
#
# Same as: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Caddy obtains and renews the certificate for DOMAIN from Let's Encrypt; the
# domain's A/AAAA records must point at this host and ports 80 and 443 be open.
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  proxy:
    image: caddy:2.8.4-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [public]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped
    <<: *logging

  web:
    # Reached only through the proxy.
    ports: !reset []
    environment:
      REAL_IP_FROM: 172.28.0.0/24
      SERVER_NAME: ${DOMAIN}
      HSTS: ${HSTS:-max-age=63072000; includeSubDomains}
    <<: *logging

  api:
    <<: *logging

  db:
    <<: *logging

  # pg_dump every night; keeps BACKUP_KEEP_DAYS days of compressed dumps in the
  # db-backups volume. Restore: see deploy/backup.sh.
  backup:
    image: postgres:16-alpine
    environment:
      PGHOST: db
      PGUSER: zenstra
      PGDATABASE: zenstra
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - db-backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh", "loop"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    <<: *logging

networks:
  public:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy-data: {}
  caddy-config: {}
  db-backups: {}
