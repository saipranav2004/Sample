# Zenstra AI website: static files only, served by unprivileged nginx on :8080.
# Put TLS (HTTPS) in front of this container: a load balancer, CDN or reverse proxy.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index home.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Health check for the container and any load balancer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # "/" is the home page; "/company" serves company.html, and so on.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /home.html =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }

    # Scripts and styles keep their names between releases, so browsers revalidate
    # them (cheap 304s) rather than caching them blindly.
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Images change rarely: cache for 30 days.
    location ~* \.(?:png|webp|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Never serve hidden files.
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
