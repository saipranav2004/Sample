# Zenstra AI website: prerendered pages and built assets, served by unprivileged
# nginx on :8080. Put TLS (HTTPS) in front of this container: a load balancer, CDN or
# reverse proxy.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/zenstra;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    # Health check for the container and any load balancer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Links to the old static site keep working.
    location = /home.html { return 301 /; }
    location = /home { return 301 /; }

    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Pages: "/company" serves company.html,
    # "/platform/agent-identity" serves platform/agent-identity.html, and so on.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html =404;
    }

    # Built scripts and styles have a content hash in their names: cache for a year.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Images and media change rarely: cache for 30 days.
    location ~* \.(?:png|webp|jpg|jpeg|svg|ico|mp4|webm)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # boot.js keeps its name between releases: revalidate it.
    location = /boot.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Never serve hidden files.
    location ~ /\. {
        deny all;
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
