<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/brand/mark.png" />
    <link rel="apple-touch-icon" href="/brand/mark.png" />
    <meta name="theme-color" content="#071b33" />
    <meta
      name="description"
      content="Deep Algorithms NHI Console — discovery, posture and credential exposure for non-human identities across AWS."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>NHI Console · Deep Algorithms</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      try {
        var stored = localStorage.getItem('dna.theme');
        var theme =
          stored ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
